name: build-windows

# Builds the Windows app and publishes it as a GitHub Release, so downloading
# is one click with no login and no digging through the Actions tab:
#
#     https://github.com/<owner>/<repo>/releases/latest
#
# Every build gets a unique, increasing version (0.1.<run number>), so two
# downloads never clash: each is its own release, its own zip name, and its
# own folder when unzipped.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One unique, increasing version per build. run_number only ever goes up,
      # so no two builds share a version and nothing overwrites anything.
      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0,7)
          $version = "0.1.${{ github.run_number }}"
          "version=$version"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "full=$version+$short"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "folder=PhoneDataTransfer-v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $version+$short"

      # Stamp the version into the app so the title bar and `--version` show
      # exactly which build this is.
      - name: Stamp the build version
        shell: pwsh
        run: |
          'VERSION = "${{ steps.ver.outputs.full }}"' | Out-File -FilePath src/ptransfer/_build.py -Encoding utf8

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      # Nice to have, not essential: without it the app offers to download
      # adb/fastboot on first run, so a blip at Google's end must not fail
      # the whole build.
      - name: Fetch adb and fastboot to bundle
        continue-on-error: true
        run: |
          python -c "from ptransfer.platform_tools import download_platform_tools; print(download_platform_tools('build-tools'))"

      # scrcpy is the mirroring engine, so shipping it means mirroring works
      # the moment the app opens, with nothing to download.
      - name: Fetch scrcpy to bundle
        continue-on-error: true
        run: |
          python -c "from ptransfer.platform_tools import download_scrcpy; print(download_scrcpy('build-tools/scrcpy'))"

      - name: Build the app
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--clean", "--onedir", "--windowed",
            "--name", "PhoneDataTransfer",
            "--paths", "src",
            "--collect-submodules", "ptransfer",
            "--collect-submodules", "ptransfer_gui"
          )
          if (Test-Path "build-tools/platform-tools/adb.exe") {
            Write-Host "Bundling adb and fastboot."
            $args += @("--add-data", "build-tools/platform-tools;platform-tools")
          } else {
            Write-Warning "platform-tools not fetched; the app will download them on first run."
          }
          $scrcpy = Get-ChildItem -Path "build-tools/scrcpy" -Filter "scrcpy.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($scrcpy) {
            Write-Host "Bundling scrcpy from $($scrcpy.DirectoryName)"
            $args += @("--add-data", "$($scrcpy.DirectoryName);scrcpy")
          } else {
            Write-Warning "scrcpy not fetched; the app will download it on first use."
          }
          $args += "src/ptransfer_gui/app.py"
          python -m PyInstaller @args

      - name: Build the command line tool
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name ptransfer `
            --paths src `
            --collect-submodules ptransfer `
            src/ptransfer/cli.py

      - name: Collect everything into one folder
        shell: pwsh
        run: |
          $out = "${{ steps.ver.outputs.folder }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse dist/PhoneDataTransfer/* $out/
          Copy-Item dist/ptransfer.exe $out/
          Copy-Item README.md $out/
          Copy-Item docs/soft-brick-rescue.md $out/
          "${{ steps.ver.outputs.full }}" | Out-File -FilePath "$out/VERSION.txt" -Encoding utf8
          @"
          Phone Data Transfer - version ${{ steps.ver.outputs.full }}
          =====================================================

          Double-click PhoneDataTransfer.exe to start.

          adb, fastboot and scrcpy are already included in this folder -
          nothing else to install.

          For the command line, open PowerShell in this folder and run:
              .\ptransfer.exe --help
              .\ptransfer.exe devices
              .\ptransfer.exe nokia --fix-bootloop

          If Windows SmartScreen warns that the publisher is unknown, that is
          because this build is not code-signed. Choose "More info" then
          "Run anyway".

          This is version ${{ steps.ver.outputs.full }}. Newer builds live at:
              https://github.com/${{ github.repository }}/releases/latest

          Read soft-brick-rescue.md before doing anything to a phone that will
          not start.
          "@ | Out-File -FilePath "$out/READ ME FIRST.txt" -Encoding utf8

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path "${{ steps.ver.outputs.folder }}" -DestinationPath "${{ steps.ver.outputs.folder }}.zip"

      # Kept as a fallback for anyone browsing the Actions tab.
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.folder }}
          path: ${{ steps.ver.outputs.folder }}/
          retention-days: 30

      # The easy path: a real Release. 'latest' always points at the newest,
      # and each release keeps its own version so nothing clashes.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Phone Data Transfer ${{ steps.ver.outputs.version }}
          body: |
            **One-click download:** grab `${{ steps.ver.outputs.folder }}.zip` from **Assets** below, unzip it, and run **PhoneDataTransfer.exe**.

            adb, fastboot and scrcpy are bundled — nothing else to install.

            Version `${{ steps.ver.outputs.full }}`. Windows may warn that the publisher is unknown (the build is not code-signed): choose **More info → Run anyway**.
          files: ${{ steps.ver.outputs.folder }}.zip
          make_latest: true
